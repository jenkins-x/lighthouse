{{- $mode := include "lighthouse.authMode" . }}
{{- if include "lighthouse.usesCredentialsDir" . }}
{{- $external := and (eq $mode "githubApp") (((.Values.auth).githubApp).existingSecretName) }}
{{- if not $external }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "lighthouse.credentialsSecretName" . }}
  labels:
    app: {{ template "fullname" . }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
data:
{{- $username := include "lighthouse.botUsername" . }}
{{- if $username }}
  username: {{ $username | b64enc | quote }}
{{- end }}
{{- if eq $mode "githubApp" }}
{{- if not (((.Values.auth).githubApp).appId) }}
{{- fail "auth.githubApp.appId is required when auth.mode is githubApp" }}
{{- end }}
{{- if not (((.Values.auth).githubApp).privateKey) }}
{{- fail "auth.githubApp.privateKey is required when auth.mode is githubApp (or set auth.githubApp.existingSecretName)" }}
{{- end }}
  appId: {{ .Values.auth.githubApp.appId | toString | b64enc | quote }}
  privateKey: {{ .Values.auth.githubApp.privateKey | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
